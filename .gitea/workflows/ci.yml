# Tests bei jedem Push und PR; Image-Build nur für main (nightly) und v*-Tags
# (Versionsnummer + latest).
# Das Image landet in der Gitea-Container-Registry dieser Instanz.
# Login: Secret REGISTRY_TOKEN (write:package), sonst der Job-Token.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tags: main -> nightly; v1.2.3 -> 1.2.3 und latest (Vorabversionen wie
      # v1.2.3-rc1 bekommen nur ihre Versionsnummer).
      - name: Image-Koordinaten bestimmen
        id: img
        run: |
          host="${GITHUB_SERVER_URL#*://}"
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "image=${host}/${repo}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${version}"
            case "${version}" in *-*) ;; *) tags="${tags} latest" ;; esac
          else
            tags="nightly"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Login, Build, Push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || github.token }}
        run: |
          image="${{ steps.img.outputs.image }}"
          echo "${REGISTRY_TOKEN}" \
            | docker login "${{ steps.img.outputs.host }}" -u "${{ github.actor }}" --password-stdin
          args=()
          for t in ${{ steps.img.outputs.tags }}; do args+=(-t "${image}:${t}"); done
          docker build "${args[@]}" .
          for t in ${{ steps.img.outputs.tags }}; do docker push "${image}:${t}"; done
