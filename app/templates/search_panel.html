<div class="search-panel" id="search-{{ expense.id }}">
  <form
    class="search-form"
    hx-get="/search"
    hx-target="#search-{{ expense.id }}"
    hx-swap="outerHTML"
    hx-indicator="#search-ind-{{ expense.id }}"
  >
    <input type="hidden" name="expense_id" value="{{ expense.id }}" />
    <input type="hidden" name="year" value="{{ year }}" />
    <div class="search-row">
      <input
        type="search"
        name="q"
        value="{{ q }}"
        placeholder="Volltext, Titel, Rechnungsnr. …"
        aria-label="Suche"
      />
      <button type="submit">Suchen</button>
    </div>
    <div class="preset-row">
      {% for key, label in presets %}
      <button type="submit" name="preset" value="{{ key }}" class="preset {% if preset == key %}active{% endif %}">{{ label }}</button>
      {% endfor %}
    </div>
    <div class="search-filters">
      <label><input type="checkbox" name="unlinked_only" value="1" {% if unlinked_only %}checked{% endif %} /> nur unlinked</label>
      <label>von <input type="date" name="date_from" value="{{ date_from }}" /></label>
      <label>bis <input type="date" name="date_to" value="{{ date_to }}" /></label>
      <label>Korrespondent <input type="text" name="correspondent" value="{{ correspondent }}" /></label>
    </div>
  </form>
  <div id="search-ind-{{ expense.id }}" class="htmx-indicator muted">Suche …</div>
  {% if error %}
  <p class="flash err">{{ error }}</p>
  {% elif searched %}
    {% if not hits %}
    <p class="muted">Keine Treffer.</p>
    {% endif %}
    {% for doc in hits %}
    <div class="candidate kb-item">
      <div class="cand-layout">
        <a class="thumb-link" href="{{ settings.document_url(doc.id) }}" target="_blank" rel="noopener" title="In Paperless öffnen">
          <img class="thumb" src="/preview/{{ doc.id }}/thumb" alt="" loading="lazy" />
        </a>
        <div class="cand-body">
          <div class="cand-head">
            <a href="{{ settings.document_url(doc.id) }}" target="_blank" rel="noopener">{{ doc.title or ('#' ~ doc.id) }}</a>
          </div>
          <p class="muted">{{ doc.correspondent_name or '—' }} · {{ doc.created_date or '—' }}</p>
          <form method="post" action="/link">
            <input type="hidden" name="expense_id" value="{{ expense.id }}" />
            <input type="hidden" name="document_id" value="{{ doc.id }}" />
            <input type="hidden" name="year" value="{{ year }}" />
            <input type="hidden" name="return_to" value="match" />
            <button type="submit">Verknüpfen</button>
          </form>
        </div>
      </div>
    </div>
    {% endfor %}
  {% endif %}
</div>
