{% extends "base.html" %}
{% block title %}Passwort ändern — PaperNinja{% endblock %}
{% block content %}
<section class="hero-block">
  <h1>{{ T.hero_password_title }}</h1>
  <p>{{ T.hero_password_desc }}</p>
</section>
<form method="post" action="/password" class="login-form" style="max-width: 22rem;">
  <label for="current">{{ T.password_current }}</label>
  <input id="current" name="current" type="password" autocomplete="current-password" required />
  <label for="password">{{ T.password_new }}</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
  <label for="password_confirm">{{ T.password_confirm }}</label>
  <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="8" />
  <button type="submit">{{ T.password_btn }}</button>
</form>
{% endblock %}
